[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    Health_Check  On

# Collect Docker container logs
[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M

# Add metadata to logs
[FILTER]
    Name          modify
    Match         *
    Add           service.namespace keycloak-poc
    Add           deployment.environment ${ENVIRONMENT}

# Parse JSON logs if applicable
[FILTER]
    Name          parser
    Match         *
    Key_Name      log
    Parser        json
    Reserve_Data  On
    Preserve_Key  On

# Add timestamp processing
[FILTER]
    Name          lua
    Match         *
    Script        /fluent-bit/etc/timestamp.lua
    Call          add_timestamp

# Output to OpenTelemetry Collector
[OUTPUT]
    Name                 opentelemetry
    Match                *
    Host                 20.14.90.107
    Port                 4318
    Logs_uri             /v1/logs
    Log_response_payload True
    Tls                  Off
    Add_label            app keycloak-poc
    Add_label            source fluent-bit
    Add_label            event.domain auth

# Debug output (optional, can be removed in production)
[OUTPUT]
    Name   stdout
    Match  *
    Format json_lines
