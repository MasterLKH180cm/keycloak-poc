[SERVICE]
    Flush         1
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    Health_Check  On

# Collect Docker container logs
[INPUT]
    Name              forward
    Listen            0.0.0.0
    Port              24224
    Buffer_Chunk_Size 1M
    Buffer_Max_Size   6M

# Add metadata to logs - common for all containers
[FILTER]
    Name          modify
    Match         *
    Add           service.namespace keycloak-poc
    Add           deployment.environment ${ENVIRONMENT}

# Set event.domain for Keycloak (authentication domain)
[FILTER]
    Name          modify
    Match         docker.keycloak
    Add           event.domain auth-session
    Add           app keycloak

# Set event.domain for Backend API (application domain)
[FILTER]
    Name          modify
    Match         docker.backend
    Add           event.domain auth-session
    Add           app api

# Set event.domain for Nginx (proxy domain)
[FILTER]
    Name          modify
    Match         docker.nginx
    Add           event.domain auth-session
    Add           app nginx

# Set event.domain for Database (infrastructure domain)
[FILTER]
    Name          modify
    Match         docker.db
    Add           event.domain auth-session
    Add           app database

# Set event.domain for Redis (infrastructure domain)
[FILTER]
    Name          modify
    Match         docker.redis
    Add           event.domain auth-session
    Add           app redis

# Parse JSON logs if applicable
[FILTER]
    Name          parser
    Match         *
    Key_Name      log
    Parser        json
    Reserve_Data  On
    Preserve_Key  On

# Output to OpenTelemetry Collector
[OUTPUT]
    Name          opentelemetry
    Match         *
    Host          20.14.90.107
    Port          4318
    Logs_uri      /v1/logs
    Tls           Off
    Tls.verify    Off
    # Add_label     service.namespace $service.namespace
    # Add_label     deployment.environment $deployment.environment
    # Add_label     event.domain $event.domain
    # Add_label     app $app
    # Add_label     container_name $container_name
    # Add_label     container_id $container_id
    # Add_label     source $source

# Debug output (optional, can be removed in production)
[OUTPUT]
    Name   stdout
    Match  *
    Format json_lines